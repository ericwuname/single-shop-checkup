<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>今天 · 录入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #0E6B58;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F4F1;color:#16201C;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <div style="flex-grow:1;min-height:0;overflow-y:auto;padding:28px 20px 16px;display:flex;flex-direction:column;gap:24px">

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:14px;font-weight:500;color:#55625C">喜洋洋 · 打烊后记三样，10 秒就好</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button type="button" aria-label="前一天" style="width:44px;height:44px;padding:0;border:1px solid #DCE2DE;border-radius:12px;background:#fff;color:#16201C;display:flex;align-items:center;justify-content:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div style="text-align:center">
          <div style="font-size:26px;font-weight:700;line-height:1.2">10月18日</div>
          <div style="font-size:14px;color:#55625C">周日 · 今天</div>
        </div>
        <button type="button" aria-label="后一天" style="width:44px;height:44px;padding:0;border:1px solid #DCE2DE;border-radius:12px;background:#fff;color:#16201C;display:flex;align-items:center;justify-content:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="background:#fff;border:1px solid #DCE2DE;border-radius:16px;display:flex;flex-direction:column">
        <label style="display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:80px;box-sizing:border-box">
          <span style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:18px;font-weight:700">营业额</span>
            <span style="font-size:13px;color:#55625C">今天一共收了多少</span>
          </span>
          <input inputmode="numeric" value="{{revenue}}" onChange="{{setRevenue}}" style="width:120px;padding:0;border:0;background:transparent;text-align:right;font-size:32px;font-weight:700;color:#16201C;font-variant-numeric:tabular-nums">
          <span style="font-size:15px;color:#55625C">元</span>
        </label>
        <div style="height:1px;background:#E6EAE7;margin:0 16px"></div>
        <label style="display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:80px;box-sizing:border-box">
          <span style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:18px;font-weight:700">买菜进货</span>
            <span style="font-size:13px;color:#55625C">菜、肉、调料、包装都算，按今天买的</span>
          </span>
          <input inputmode="numeric" value="{{purchase}}" onChange="{{setPurchase}}" style="width:120px;padding:0;border:0;background:transparent;text-align:right;font-size:32px;font-weight:700;color:#16201C;font-variant-numeric:tabular-nums">
          <span style="font-size:15px;color:#55625C">元</span>
        </label>
      </div>
      <div style="font-size:13px;color:#55625C;padding:0 4px">昨天记的：营业额 3,800 元，买菜 1,300 元</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:18px;font-weight:700">今天谁上班</span>
        <span style="font-size:14px;font-weight:500;color:#55625C">{{hoursText}}</span>
      </div>
      <div style="font-size:13px;color:#55625C">已按昨天排好，不对就点一下取消</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button type="button" aria-pressed="{{liOn}}" onClick="{{toggleLi}}" style="{{liStyle}}">
          <span>小李</span>
          <span style="font-size:13px;font-weight:500">18:00–22:00 · 4 小时</span>
        </button>
        <button type="button" aria-pressed="{{zhangOn}}" onClick="{{toggleZhang}}" style="{{zhangStyle}}">
          <span>老张</span>
          <span style="font-size:13px;font-weight:500">18:00–22:00 · 4 小时</span>
        </button>
        <button type="button" style="min-height:56px;padding:8px 16px;border-radius:14px;border:2px dashed #AEB9B3;background:transparent;color:#3E4A44;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>加一个人</span>
        </button>
      </div>
    </div>

  </div>

  <div style="flex-shrink:0;padding:12px 20px;background:#F2F4F1">
    <a href="Reply.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;background:#0E6B58;color:#fff;font-size:18px;font-weight:700">存好了，看今天的结果</a>
  </div>

  <nav aria-label="主导航" style="flex-shrink:0;height:72px;display:flex;background:#fff;border-top:1px solid #DCE2DE">
    <a href="Main.dc.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#0E6B58;font-size:13px;font-weight:700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
      今天
    </a>
    <a href="Week.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#55625C;font-size:13px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>
      本周
    </a>
    <a href="Setup.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#55625C;font-size:13px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5.5 12v8h13v-8"/></svg>
      我的店
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { revenue: '4200', purchase: '1700', li: true, zhang: true };
  }
  renderVals() {
    const s = this.state;
    const base = 'display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 16px;border-radius:14px;font-size:16px;font-weight:700;text-align:left;cursor:pointer;';
    const on = base + 'border:2px solid #0E6B58;background:#E1F0EB;color:#0B4F41;';
    const off = base + 'border:2px solid #C5CEC9;background:#fff;color:#55625C;';
    const hours = (s.li ? 4 : 0) + (s.zhang ? 4 : 0);
    const clean = (v) => String(v).replace(/[^0-9.]/g, '');
    return {
      revenue: s.revenue,
      purchase: s.purchase,
      hoursText: hours > 0 ? '共 ' + hours + ' 小时' : '今天没人上班',
      liOn: s.li,
      zhangOn: s.zhang,
      liStyle: s.li ? on : off,
      zhangStyle: s.zhang ? on : off,
      setRevenue: (e) => this.setState({ revenue: clean(e.target.value) }),
      setPurchase: (e) => this.setState({ purchase: clean(e.target.value) }),
      toggleLi: () => this.setState({ li: !this.state.li }),
      toggleZhang: () => this.setState({ zhang: !this.state.zhang })
    };
  }
}
</script>
</body>
</html>
