<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F4F1;color:#16201C;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <div style="flex-grow:1;min-height:0;overflow-y:auto;padding:28px 20px 20px;display:flex;flex-direction:column;gap:16px">

    </div>

    <div style="background:#fff;border:1px solid #DCE2DE;border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:14px;color:#55625C">这周一共卖了</div>
        <div style="display:flex;align-items:baseline;gap:6px">
          <span style="font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2">32,300</span>
          <span style="font-size:15px;color:#55625C">元，平均每天 4,614</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:8px;align-items:end;height:116px" role="img" aria-label="每天营业额：周一 3800，周二 4200，周三 3600，周四 4500，周五 5200，周六 6100 最高，周日 4900">

        <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:82px;border-radius:6px 6px 2px 2px;background:#6E9C8D"></div></div>
        <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:96px;border-radius:6px 6px 2px 2px;background:#0E6B58"></div></div>
        <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:77px;border-radius:6px 6px 2px 2px;background:#6E9C8D"></div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:8px;font-size:13px;color:#55625C;text-align:center" aria-hidden="true">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span style="font-weight:700;color:#0B4F41">六</span><span>日</span>

      <div style="font-size:14px;color:#55625C">周六最好，卖了 6,100；周三最淡，3,600。</div>
    </div>

    <div style="background:#fff;border:1px solid #DCE2DE;border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:16px;font-weight:700">买菜占营业额</div>
        <div style="display:flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:16px;background:#E1F0EB;color:#0B4F41;font-size:14px;font-weight:700">

          正常
        </div>
      </div>
      <div style="font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1">34.1%</div>
      <div style="position:relative;height:28px" role="img" aria-label="34.1%，落在同类快餐店常见的 28% 到 38% 之内">
        <div style="position:absolute;left:0;right:0;top:10px;height:8px;border-radius:4px;background:#E6EAE7"></div>
        <div style="position:absolute;left:56%;width:20%;top:10px;height:8px;border-radius:4px;background:#B9DACF"></div>
        <div style="position:absolute;left:68.2%;top:2px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:#0E6B58"></div>
      </div>

        <span style="position:absolute;left:56%;transform:translateX(-50%)">28%</span>
        <span style="position:absolute;left:76%;transform:translateX(-50%)">38%</span>
      </div>
      <div style="font-size:15px;line-height:1.5">在同类快餐店常见的 28%–38% 之内，照常记就行。</div>
    </div>

    <div style="background:#fff;border:1px solid #DCE2DE;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div style="font-size:16px;font-weight:700">人工</div>
        <div style="font-size:15px;color:#55625C">排班工钱 1,400 元，占 4.3%</div>
      </div>
      <div style="font-size:15px;line-height:1.5;color:#55625C">还没填员工月薪，这个数先不评高低。</div>
      <a href="Setup.dc.html" style="display:flex;align-items:center;justify-content:space-between;min-height:44px;color:#0E6B58;font-size:16px;font-weight:700">
        去补员工月薪
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>

    <div style="background:#16201C;color:#fff;border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:14px;color:#C9D3CE">按你填的房租、水电和人工算</div>
      <div style="font-size:20px;font-weight:700;line-height:1.4">每天至少要做 <span style="font-size:32px;font-variant-numeric:tabular-nums">750</span> 元才不亏</div>
    </div>

  </div>

  <nav aria-label="主导航" style="flex-shrink:0;height:72px;display:flex;background:#fff;border-top:1px solid #DCE2DE">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5.5 12v8h13v-8"/></svg>
