<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的店</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #0E6B58;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F4F1;color:#16201C;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <div style="flex-grow:1;min-height:0;overflow-y:auto;padding:28px 20px 20px;display:flex;flex-direction:column;gap:22px">

    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:26px;font-weight:700;line-height:1.2">我的店</div>
      <div style="font-size:14px;color:#55625C">喜洋洋 · 小吃快餐</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:column;gap:2px;padding:0 4px">
        <div style="font-size:18px;font-weight:700">先填这三样</div>
        <div style="font-size:13px;color:#55625C">填完，“每天至少做多少才不亏”就能算了。一个月填一次就行。</div>
      </div>
      <div style="background:#fff;border:1px solid #DCE2DE;border-radius:16px;display:flex;flex-direction:column">
        <label style="display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:68px;box-sizing:border-box">
          <span style="flex-grow:1;font-size:17px;font-weight:700">每月房租</span>
          <input inputmode="numeric" readonly value="6000" style="width:110px;padding:0;border:0;background:transparent;text-align:right;font-size:26px;font-weight:700;color:#16201C;font-variant-numeric:tabular-nums">
          <span style="font-size:15px;color:#55625C">元</span>
        </label>
        <div style="height:1px;background:#E6EAE7;margin:0 16px"></div>
        <label style="display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:68px;box-sizing:border-box">
          <span style="flex-grow:1;font-size:17px;font-weight:700">每月水电燃气</span>
          <input inputmode="numeric" readonly value="1500" style="width:110px;padding:0;border:0;background:transparent;text-align:right;font-size:26px;font-weight:700;color:#16201C;font-variant-numeric:tabular-nums">
          <span style="font-size:15px;color:#55625C">元</span>
        </label>
        <div style="height:1px;background:#E6EAE7;margin:0 16px"></div>
        <label style="display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:68px;box-sizing:border-box">
          <span style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:17px;font-weight:700">一小时工钱</span>
            <span style="font-size:13px;color:#55625C">算排班人工用，大概就行</span>
          </span>
          <input inputmode="numeric" readonly value="25" style="width:110px;padding:0;border:0;background:transparent;text-align:right;font-size:26px;font-weight:700;color:#16201C;font-variant-numeric:tabular-nums">
          <span style="font-size:15px;color:#55625C">元</span>
        </label>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:column;gap:2px;padding:0 4px">
        <div style="font-size:18px;font-weight:700">以后再补，越全越准</div>
        <div style="font-size:13px;color:#55625C">现在不填也能用。填了，“人工高不高”才能评。</div>
      </div>
      <div style="background:#fff;border:1px solid #DCE2DE;border-radius:16px;display:flex;flex-direction:column">
        <button type="button" style="display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 16px;border:0;background:transparent;color:#16201C;text-align:left">
          <span style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:16px;font-weight:700">员工月薪</span>
            <span style="font-size:13px;color:#55625C">拿月薪的几个人，一共多少钱</span>
          </span>
          <span style="font-size:14px;font-weight:700;color:#8A4300">还没填</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55625C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div style="height:1px;background:#E6EAE7;margin:0 16px"></div>
        <button type="button" style="display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 16px;border:0;background:transparent;color:#16201C;text-align:left">
          <span style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:16px;font-weight:700">五险、公积金、员工餐</span>
            <span style="font-size:13px;color:#55625C">容易漏掉的钱</span>
          </span>
          <span style="font-size:14px;color:#55625C">还没填</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55625C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div style="height:1px;background:#E6EAE7;margin:0 16px"></div>
        <button type="button" style="display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 16px;border:0;background:transparent;color:#16201C;text-align:left">
          <span style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:16px;font-weight:700">餐具、维修、收银差异</span>
            <span style="font-size:13px;color:#55625C">一年里会花，但平时想不起来</span>
          </span>
          <span style="font-size:14px;color:#55625C">还没填</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55625C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:column;gap:2px;padding:0 4px">
        <div style="font-size:18px;font-weight:700">数据是你的</div>
        <div style="font-size:13px;color:#55625C">随时可以整份带走，也可以要求删光。</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;border:2px solid #C5CEC9;background:#fff;color:#16201C;font-size:16px;font-weight:700">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
          导出成 Excel 表格
        </button>
        <button type="button" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;border:2px solid #E3B9A8;background:#fff;color:#9B3A12;font-size:16px;font-weight:700">联系我们，删除我的全部数据</button>
      </div>
    </div>

  </div>

  <nav aria-label="主导航" style="flex-shrink:0;height:72px;display:flex;background:#fff;border-top:1px solid #DCE2DE">
    <a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#55625C;font-size:13px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
      今天
    </a>
    <a href="Week.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#55625C;font-size:13px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>
      本周
    </a>
    <a href="Setup.dc.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#0E6B58;font-size:13px;font-weight:700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5.5 12v8h13v-8"/></svg>
      我的店
    </a>
  </nav>
</div>
